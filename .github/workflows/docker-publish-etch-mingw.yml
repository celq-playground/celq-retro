name: Build and Publish Debian Etch MinGW Image

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/debian-etch-mingw

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM debian:bullseye-slim
          
          # Install debootstrap
          RUN apt-get update && apt-get install -y debootstrap
          
          # Create Debian Etch (4.0) rootfs
          # 1. We verify against nothing (--no-check-gpg) because Etch keys are long expired
          # 2. We use archive.debian.org because Etch is ancient
          RUN mkdir -p /etch
          RUN debootstrap --arch=i386 --no-check-gpg --variant=minbase etch /etch http://archive.debian.org/debian/
          
          # Configure Etch APT to point to the archive
          RUN echo "deb http://archive.debian.org/debian/ etch main contrib non-free" > /etch/etc/apt/sources.list
          
          # Force Apt to ignore expiry timestamps (Etch Release file is from 2007)
          RUN echo 'Acquire::Check-Valid-Until "false";' > /etch/etc/apt/apt.conf.d/99no-check-valid-until
          
          # Install MinGW in the Etch chroot
          # We set DEBIAN_FRONTEND=noninteractive to avoid curses errors
          # We use --force-yes because Etch apt doesn't have modern --allow-unauthenticated flags
          RUN chroot /etch apt-get update || true
          RUN chroot /etch bash -c "DEBIAN_FRONTEND=noninteractive apt-get install -y --force-yes mingw32 build-essential"
          
          # Create build dir
          RUN mkdir -p /etch/build
          WORKDIR /etch/build
          
          # Set default entrypoint to chroot into Etch
          ENTRYPOINT ["/usr/sbin/chroot", "/etch"]
          CMD ["/bin/bash"]
          EOF
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
