name: Build for Windows 98 (DOS)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install DJGPP
        run: |
          sudo apt-get update
          sudo apt-get install -y wget bzip2
          cd /tmp
          wget https://github.com/andrewwutw/build-djgpp/releases/download/v3.4/djgpp-linux64-gcc1220.tar.bz2
          sudo tar xjf djgpp-linux64-gcc1220.tar.bz2 -C /usr/local
          echo "/usr/local/djgpp/bin" >> $GITHUB_PATH
      
      - name: Compile for DOS/Win98
        run: |
          export PATH="/usr/local/djgpp/bin:$PATH"
          i586-pc-msdosdjgpp-gcc \
            -o celq.exe \
            -O2 \
            -I./vendor \
            -DHAS_UNISTD=1 \
            -DHAS_TIMESPEC=0 \
            main.c celq.c vendor/wasi.c
      
      - name: Create ISO
        run: |
          sudo apt-get install -y genisoimage
          mkdir -p iso_contents
          cp celq.exe iso_contents/
          genisoimage -o celq.iso -V "CELQ" -r -J iso_contents
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: celq-djgpp
          path: |
            celq.exe
            celq.iso
