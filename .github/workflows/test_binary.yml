      - name: Checkout smoke test repository
        uses: actions/checkout@v4
        with:
          repository: IvanIsCoding/celq
          path: celq-tests
          
      - name: Run smoke test
        run: |
          # Move the binary to a consistent location
          mkdir -p test-bin
          mv celq.exe test-bin/celq.exe
          
          # Run the smoke test script with the MinGW binary
          sh celq-tests/.github/scripts/smoke-test.sh ./test-bin/celq.exe

  test-mingw-binary-wine:
    name: Test MinGW Binary via Wine on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Install Wine
        run: |
