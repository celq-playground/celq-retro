name: Build for Windows 98 (Legacy MinGW)
on:
  workflow_dispatch:

jobs:
  build-win98-etch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Debian Etch Docker Image
        run: |
          # We use bullseye (Debian 11) because it is old enough to handle legacy bootstrapping tasks well.
          cat > Dockerfile << 'EOF'
          FROM debian:bullseye-slim
          
          # Install debootstrap
          RUN apt-get update && apt-get install -y debootstrap
          
          # Create Debian Etch (4.0) rootfs
          # 1. We verify against nothing (--no-check-gpg) because Etch keys are long expired
          # 2. We use archive.debian.org because Etch is ancient
          RUN mkdir -p /etch
          RUN debootstrap --arch=i386 --no-check-gpg --variant=minbase etch /etch http://archive.debian.org/debian/
          
          # Configure Etch APT to point to the archive
          RUN echo "deb http://archive.debian.org/debian/ etch main contrib non-free" > /etch/etc/apt/sources.list
          
          # Force Apt to ignore expiry timestamps (Etch Release file is from 2007)
          RUN echo 'Acquire::Check-Valid-Until "false";' > /etch/etc/apt/apt.conf.d/99no-check-valid-until
          
          # Install MinGW in the Etch chroot
          # We set DEBIAN_FRONTEND=noninteractive to avoid curses errors
          # We use --force-yes because Etch apt doesn't have modern --allow-unauthenticated flags
          RUN chroot /etch apt-get update || true
          RUN chroot /etch bash -c "DEBIAN_FRONTEND=noninteractive apt-get install -y --force-yes mingw32 build-essential"
          
          # Create build dir
          RUN mkdir -p /etch/build
          WORKDIR /etch/build
          EOF
          
          docker build -t debian-etch-mingw .
      
      - name: Compile with MinGW GCC 3.4.5
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/etch/build \
            debian-etch-mingw \
            /usr/sbin/chroot /etch /bin/bash -c "
              cd /build
              
              echo 'Checking Compiler Version (Target: 3.4.5):'
              i586-mingw32msvc-gcc -v
              
              echo 'Starting Build...'
              
              i586-mingw32msvc-gcc \
                -o celq.exe \
                -O2 \
                -I./vendor \
                -DHAS_UNISTD=0 \
                -DHAS_TIMESPEC=0 \
                -D_WIN32_WINNT=0x0410 \
                -DWINVER=0x0410 \
                -DWASI_FALLBACK_TIMERS_ENABLED=1 \
                -static \
                -static-libgcc \
                -march=i586 \
                -Wl,--subsystem,console:4.0 \
                -Wl,--file-alignment,512 \
                -Wl,--section-alignment,4096 \
                -s \
                main.c celq.c vendor/wasi.c \
                -lkernel32 -luser32
              
              echo 'Build Complete.'
              ls -l celq.exe
            "
            
      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: celq-win98-etch
          path: celq.exe

  create-iso:
    runs-on: ubuntu-latest
    needs: build-win98-etch
    
    steps:
      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: celq-win98-etch
      
      - name: Install genisoimage
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage
      
      - name: Create ISO
        run: |
          mkdir -p iso_contents
          cp celq.exe iso_contents/
          echo "Copy celq.exe to your Windows 98/XP machine and run it" > iso_contents/README.txt
          
          # -J for Joliet (Windows compatibility), -r for Rock Ridge (Linux compatibility)
          genisoimage -o celq.iso -V "CELQ_LEGACY" -r -J iso_contents
      
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: celq-iso
          path: celq.iso
