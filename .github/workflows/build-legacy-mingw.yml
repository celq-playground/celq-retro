name: Build for Windows 98 (Legacy MinGW)
on:
  workflow_dispatch:

jobs:
  build-win98-etch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Debian Etch Docker Image
        run: |
          # We use debian:buster as a builder because it still has good tools
          # but isn't so new that it breaks interacting with old archives.
          cat > Dockerfile << 'EOF'
          FROM debian:buster-slim
          
          # Install debootstrap
          RUN apt-get update && apt-get install -y debootstrap
          
          # Create Debian Etch rootfs
          # 1. We verify against nothing (--no-check-gpg) because keys are expired
          # 2. We use archive.debian.org
          RUN mkdir -p /etch
          RUN debootstrap --arch=i386 --no-check-gpg --variant=minbase etch /etch http://archive.debian.org/debian/
          
          # Configure Etch APT
          # Etch was the last version to use the old sources.list layout mostly
          RUN echo "deb http://archive.debian.org/debian/ etch main contrib non-free" > /etch/etc/apt/sources.list
          
          # Force Apt to ignore expiry
          RUN echo 'Acquire::Check-Valid-Until "false";' > /etch/etc/apt/apt.conf.d/99no-check-valid-until
          
          # Install MinGW in the Etch chroot
          # We use chroot to run the installation inside the Etch environment
          # We set DEBIAN_FRONTEND=noninteractive to avoid curses errors in old bash
          RUN chroot /etch apt-get update || true
          RUN chroot /etch bash -c "DEBIAN_FRONTEND=noninteractive apt-get install -y --force-yes mingw32 build-essential"
          
          # Create build dir
          RUN mkdir -p /etch/build
          WORKDIR /etch/build
          EOF
          
          docker build -t debian-etch-mingw .
      
      - name: Compile with MinGW GCC 3.4.5
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/etch/build \
            debian-etch-mingw \
            /usr/sbin/chroot /etch /bin/bash -c "
              cd /build
              
              echo 'Checking Compiler Version:'
              i586-mingw32msvc-gcc -v
              
              echo 'Starting Build...'
              # Note: In GCC 3.4, some modern flags might not exist.
              # We use -march=i586 (Pentium) to be safe for Win98
              
              i586-mingw32msvc-gcc \
                -o celq.exe \
                -O2 \
                -I./vendor \
                -DHAS_UNISTD=0 \
                -DHAS_TIMESPEC=0 \
                -D_WIN32_WINNT=0x0410 \
                -DWINVER=0x0410 \
                -DWASI_FALLBACK_TIMERS_ENABLED=1 \
                -static \
                -static-libgcc \
                -march=i586 \
                -Wl,--subsystem,console:4.0 \
                -Wl,--file-alignment,512 \
                -Wl,--section-alignment,4096 \
                -s \
                main.c celq.c vendor/wasi.c \
                -lkernel32 -luser32
              
              echo 'Build Complete.'
              ls -l celq.exe
            "
            
      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: celq-win98-etch
          path: celq.exe
