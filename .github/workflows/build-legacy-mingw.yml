name: Build for Windows 98 (Legacy MinGW)
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Debian Squeeze Docker Image from Scratch
        run: |
          # Create a Dockerfile that builds Debian Squeeze from scratch
          cat > Dockerfile << 'EOF'
          FROM debian:bullseye
          
          # Install debootstrap to create Debian Squeeze rootfs
          RUN apt-get update && apt-get install -y debootstrap
          
          # Create Debian Squeeze rootfs
          RUN debootstrap --arch=amd64 --variant=minbase squeeze /squeeze http://archive.debian.org/debian/
          
          # Configure the Squeeze environment
          RUN echo "deb http://archive.debian.org/debian/ squeeze main contrib non-free" > /squeeze/etc/apt/sources.list && \
              echo "deb http://archive.debian.org/debian-security/ squeeze/updates main contrib non-free" >> /squeeze/etc/apt/sources.list && \
              echo 'Acquire::Check-Valid-Until "false";' > /squeeze/etc/apt/apt.conf.d/99no-check-valid-until
          
          # Install MinGW in the Squeeze chroot
          RUN chroot /squeeze apt-get update && \
              chroot /squeeze apt-get install -y --force-yes mingw32 build-essential
          
          # Create build directory inside chroot
          RUN mkdir -p /squeeze/build
          
          WORKDIR /squeeze/build
          EOF
          
          # Build the Docker image
          docker build -t debian-squeeze-mingw .
      
      - name: Compile in Debian Squeeze Environment
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/squeeze/build \
            debian-squeeze-mingw \
            /usr/sbin/chroot /squeeze /bin/bash -c "
              cd /build
              i586-mingw32msvc-gcc \
                -o celq.exe \
                -O2 \
                -I./vendor \
                -DHAS_UNISTD=0 \
                -DHAS_TIMESPEC=0 \
                -D_WIN32_WINNT=0x0410 \
                -DWINVER=0x0410 \
                -DWASI_FALLBACK_TIMERS_ENABLED=1 \
                -static \
                -static-libgcc \
                -march=i686 \
                -Wl,--subsystem,console:4.0 \
                -Wl,--file-alignment,512 \
                -Wl,--section-alignment,4096 \
                -s \
                main.c celq.c vendor/wasi.c \
                -lkernel32 -luser32
              
              echo 'Compilation complete!'
              ls -lh celq.exe
            "
      
      - name: Verify Binary
        run: |
          ls -lh celq.exe
          file celq.exe
      
      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: celq-mingw-legacy
          path: celq.exe

  create-iso:
    runs-on: ubuntu-latest
    needs: build-windows
    
    steps:
      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: celq-mingw-legacy
      
      - name: Install genisoimage
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage
      
      - name: Create ISO
        run: |
          mkdir -p iso_contents
          cp celq.exe iso_contents/
          echo "Copy celq.exe to your Windows 98/XP machine and run it" > iso_contents/README.txt
          genisoimage -o celq.iso -V "CELQ" -r -J iso_contents
      
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: celq-iso
          path: celq.iso
