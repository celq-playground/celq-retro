name: Build for Windows 98 (Legacy MinGW)
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Legacy MinGW (GCC 8.5.0, 32-bit)
        uses: bwoodsend/setup-winlibs-action@v1
        with:
          tag: '8.5.0-9.0.0-r1'
          architecture: i686
          add_to_path: true
      
      - name: Verify MinGW Installation
        run: gcc --version
        shell: bash
      
      - name: Compile for Windows 98
        run: |
          gcc.exe \
          -o celq.exe \
          -O2 \
          -I./vendor \
          -DHAS_UNISTD=0 \
          -DHAS_TIMESPEC=1 \
          -D_WIN32_WINNT=0x0410 \
          -DWINVER=0x0410 \
          -DWASI_FALLBACK_TIMERS_ENABLED=1 \
          -static \
          -static-libgcc \
          -march=i686 \
          -Wl,--subsystem,console:4.0 \
          -Wl,--file-alignment,512 \
          -Wl,--section-alignment,4096 \
          -s \
          main.c celq.c vendor/wasi.c \
          -lkernel32 -luser32
        shell: bash
      
      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: celq-mingw-legacy
          path: celq.exe

  create-iso:
    runs-on: ubuntu-latest
    needs: build-windows
    
    steps:
      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: celq-mingw-legacy
      
      - name: Install genisoimage
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage
      
      - name: Create ISO
        run: |
          mkdir -p iso_contents
          cp celq.exe iso_contents/
          echo "Copy celq.exe to your Windows 98/XP machine and run it" > iso_contents/README.txt
          genisoimage -o celq.iso -V "CELQ" -r -J iso_contents
      
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: celq-iso
          path: celq.iso
