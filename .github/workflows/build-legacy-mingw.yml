name: Build for Windows 98 (Legacy MinGW)
on:
  workflow_dispatch:

jobs:
  build-windows-legacy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Debian Lenny Docker Image from Scratch
        run: |
          # Create a Dockerfile that builds Debian Lenny (5.0) from scratch
          cat > Dockerfile << 'EOF'
          FROM debian:bullseye
          
          # Install debootstrap
          RUN apt-get update && apt-get install -y debootstrap
          
          # Create Debian Lenny rootfs
          # We use --no-check-gpg because the release keys are long expired
          RUN debootstrap --arch=amd64 --no-check-gpg --variant=minbase lenny /lenny http://archive.debian.org/debian/
          
          # Configure the Lenny environment
          # Note: We must point to archive.debian.org
          RUN echo "deb http://archive.debian.org/debian/ lenny main contrib non-free" > /lenny/etc/apt/sources.list && \
              echo 'Acquire::Check-Valid-Until "false";' > /lenny/etc/apt/apt.conf.d/99no-check-valid-until
          
          # Install MinGW in the Lenny chroot
          # Lenny uses --force-yes instead of modern --allow-unauthenticated flags
          RUN chroot /lenny apt-get update && \
              chroot /lenny apt-get install -y --force-yes mingw32 build-essential
          
          # Create build directory
          RUN mkdir -p /lenny/build
          WORKDIR /lenny/build
          EOF
          
          # Build the Docker image
          docker build -t debian-lenny-mingw .
      
      - name: Compile in Debian Lenny Environment
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/lenny/build \
            debian-lenny-mingw \
            /usr/sbin/chroot /lenny /bin/bash -c "
              cd /build
              
              # Check compiler version for verification in logs
              i586-mingw32msvc-gcc --version
              
              i586-mingw32msvc-gcc \
                -o celq.exe \
                -O2 \
                -I./vendor \
                -DHAS_UNISTD=0 \
                -DHAS_TIMESPEC=0 \
                -D_WIN32_WINNT=0x0410 \
                -DWINVER=0x0410 \
                -DWASI_FALLBACK_TIMERS_ENABLED=1 \
                -static \
                -static-libgcc \
                -march=i586 \
                -Wl,--subsystem,console:4.0 \
                -Wl,--file-alignment,512 \
                -Wl,--section-alignment,4096 \
                -s \
                main.c celq.c vendor/wasi.c \
                -lkernel32 -luser32
              
              echo 'Compilation complete!'
              ls -lh celq.exe
            "
      
      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: celq-win98-legacy
          path: celq.exe

  create-iso:
    runs-on: ubuntu-latest
    needs: build-windows-legacy
    steps:
      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: celq-win98-legacy
      
      - name: Install genisoimage
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage
      
      - name: Create ISO
        run: |
          mkdir -p iso_contents
          cp celq.exe iso_contents/
          echo "Copy celq.exe to your Windows 98/XP machine and run it" > iso_contents/README.txt
          genisoimage -o celq.iso -V "CELQ_LEGACY" -r -J iso_contents
      
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: celq-iso
          path: celq.iso
