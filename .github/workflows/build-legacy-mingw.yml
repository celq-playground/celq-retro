name: Build for Windows 98 (Using Published MinGW Image)
on:
  workflow_dispatch:

jobs:
  build-win98-etch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Compile with MinGW GCC 3.4.5
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/etch/build \
            ghcr.io/celq-playground/celq-retro/debian-etch-mingw:latest \
            /bin/bash -c "
              cd /build
              
              echo 'Checking Compiler Version (Target: 3.4.5):'
              i586-mingw32msvc-gcc -v
              
              echo 'Starting Build...'
              
              i586-mingw32msvc-gcc \
                -o celq.exe \
                -O2 \
                -I./vendor \
                -DHAS_UNISTD=0 \
                -DHAS_TIMESPEC=0 \
                -D_WIN32_WINNT=0x0410 \
                -DWINVER=0x0410 \
                -DWASI_FALLBACK_TIMERS_ENABLED=1 \
                -static \
                -static-libgcc \
                -march=i586 \
                -Wl,--subsystem,console:4.0 \
                -Wl,--file-alignment,512 \
                -Wl,--section-alignment,4096 \
                -s \
                main.c celq.c vendor/wasi.c \
                -lkernel32 -luser32 -ladvapi32
              
              echo 'Build Complete.'
              ls -l celq.exe
            "
            
      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: celq-win98-etch
          path: celq.exe
          
  create-iso:
    runs-on: ubuntu-latest
    needs: build-win98-etch
    
    steps:
      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: celq-win98-etch
      
      - name: Install genisoimage
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage
      
      - name: Create ISO
        run: |
          mkdir -p iso_contents
          cp celq.exe iso_contents/
          echo "Copy celq.exe to your Windows 98/XP machine and run it" > iso_contents/README.txt
          
          # -J for Joliet (Windows compatibility), -r for Rock Ridge (Linux compatibility)
          genisoimage -o celq.iso -V "CELQ_LEGACY" -r -J iso_contents
      
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: celq-iso
          path: celq.iso
