            ls -lh celq
            file celq || echo "file command not available"
            
            # Move the binary to a consistent location
            mkdir -p test-bin
            mv celq test-bin/celq
            
            # Run the smoke test script with the APE binary
            sh celq-tests/.github/scripts/smoke-test.sh ./test-bin/celq

  test-ape-binary-windows:
    name: Test APE Binary on Windows
    runs-on: windows-latest
