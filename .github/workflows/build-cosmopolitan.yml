    steps:
      - name: Checkout smoke test repository
        uses: actions/checkout@v4
        with:
          repository: IvanIsCoding/celq
          path: celq-tests
          
      - name: Test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          run: |
            # Download APE binary
            fetch -o celq-ape.zip https://github.com/celq-playground/celq-retro/releases/download/v0.3.3-1/celq-cosmopolitan.zip
            
            # Extract celq
            unzip celq-ape.zip
            chmod +x celq
            
