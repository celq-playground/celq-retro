name: Build for Windows 98 (First MinGW by Debian)
on:
  workflow_dispatch:
jobs:
  build-win98-woody:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Debian Woody Docker Image
        run: |
          cat > Dockerfile << 'EOF'
          FROM debian:bullseye-slim
          
          # Install debootstrap and required tools
          RUN apt-get update && apt-get install -y debootstrap wget
          
          # Create Debian Woody (3.0) rootfs
          # Woody is from 2002 - no fancy variants, just basic debootstrap
          RUN mkdir -p /woody
          RUN debootstrap --arch=i386 --no-check-gpg woody /woody http://archive.debian.org/debian/
          
          # Configure Woody APT sources
          RUN echo "deb http://archive.debian.org/debian/ woody main contrib non-free" > /woody/etc/apt/sources.list
          
          # Disable validity checks for ancient Release files
          RUN echo 'Acquire::Check-Valid-Until "false";' > /woody/etc/apt/apt.conf.d/99no-check-valid-until
          
          # Install MinGW in the Woody chroot
          # Note: Woody's MinGW is extremely old (circa 2001-2002)
          RUN chroot /woody apt-get update || true
          RUN chroot /woody bash -c "DEBIAN_FRONTEND=noninteractive apt-get install -y --force-yes mingw32 gcc make"
          
          # Create build directory
          RUN mkdir -p /woody/build
          WORKDIR /woody/build
          EOF
          
          docker build -t debian-woody-mingw .
      
      - name: Compile with Woody MinGW
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/woody/build \
            debian-woody-mingw \
            /usr/sbin/chroot /woody /bin/bash -c "
              cd /build
              
              echo '=== Checking Compiler Version ==='
              i386-mingw32msvc-gcc -v 2>&1 || i586-mingw32msvc-gcc -v 2>&1 || mingw32-gcc -v 2>&1
              
              echo '=== Starting Build ==='
              
              # Try different compiler prefixes (Woody used different naming)
              COMPILER=\$(command -v i386-mingw32msvc-gcc || command -v i586-mingw32msvc-gcc || command -v mingw32-gcc)
              
              echo \"Using compiler: \$COMPILER\"
              
              \$COMPILER \
                -o celq.exe \
                -O2 \
                -I./vendor \
                -DHAS_UNISTD=0 \
                -DHAS_TIMESPEC=0 \
                -D_WIN32_WINNT=0x0410 \
                -DWINVER=0x0410 \
                -DWASI_FALLBACK_TIMERS_ENABLED=1 \
                -static \
                -march=i386 \
                -Wl,--subsystem,console:4.0 \
                -Wl,--file-alignment,512 \
                -Wl,--section-alignment,4096 \
                -s \
                main.c celq.c vendor/wasi.c \
                -lkernel32 -luser32 -ladvapi32
              
              echo '=== Build Complete ==='
              ls -lh celq.exe
              file celq.exe
            "
            
      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: celq-win98-woody
          path: celq.exe
          
  create-iso:
    runs-on: ubuntu-latest
    needs: build-win98-woody
    
    steps:
      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: celq-win98-woody
      
      - name: Install genisoimage
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage
      
      - name: Create ISO
        run: |
          mkdir -p iso_contents
          cp celq.exe iso_contents/
          echo "CELQ - Built with Debian Woody MinGW (circa 2002)" > iso_contents/README.txt
          echo "Compatible with Windows 98/ME/2000/XP" >> iso_contents/README.txt
          
          genisoimage -o celq.iso -V "CELQ_WOODY" -r -J iso_contents
      
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: celq-iso-woody
          path: celq.iso
